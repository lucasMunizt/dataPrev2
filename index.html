as claras."},{"s":"ce","tag":"Scrum","q":"De acordo com o Guia do Scrum (2020), o Scrum Team é composto por","o":["Product Owner, Scrum Master e Developers.","Gerente de Projeto, Analistas e Testadores.","Product Owner, Scrum Master e Stakeholders.","Scrum Master, Arquiteto e Equipe de Desenvolvimento.","Cliente, Product Owner e Gerente Funcional."],"a":0,"e":"O Guia 2020 define três responsabilidades (accountabilities): Product Owner, Scrum Master e Developers, sem sub-times ou hierarquias."},{"s":"ce","tag":"Scrum","q":"Sobre os eventos do Scrum, assinale a correta.","o":["A Sprint Retrospective ocorre antes da Sprint Review.","A Sprint tem duração mínima de 2 meses.","A Daily Scrum tem duração máxima de 15 minutos e é um evento para os Developers.","O Product Owner deve conduzir a Daily Scrum.","A Sprint Planning é opcional."],"a":2,"e":"Daily: até 15 min, para os Developers inspecionarem o progresso rumo à Meta da Sprint. Sprints duram até um mês. A Retrospectiva é o último evento, após a Review."},{"s":"ce","tag":"Kanban","q":"No método Kanban, a prática que limita a quantidade de itens em cada etapa do fluxo, expondo gargalos e reduzindo o tempo de ciclo, é","o":["o limite de WIP (Work in Progress).","a definição de sprints fixas.","o Planning Poker.","a programação em pares.","o burndown chart."],"a":0,"e":"Limitar o WIP cria um sistema puxado: só se inicia um novo item quando há capacidade. Kanban não prescreve sprints nem papéis."},{"s":"ce","tag":"XP","q":"São práticas características do Extreme Programming (XP):","o":["programação em pares, integração contínua, TDD, pequenas entregas e propriedade coletiva do código.","documentação extensiva antes da codificação e fases sequenciais.","papéis de Product Owner e Scrum Master.","planejamento anual detalhado e congelamento de escopo.","testes somente ao final do projeto."],"a":0,"e":"XP enfatiza excelência técnica: pair programming, TDD, CI, refatoração, design simples, releases pequenos, propriedade coletiva e ritmo sustentável."},{"s":"ce","tag":"Padrões de projeto","q":"Um sistema calcula benefícios com regras diferentes (aposentadoria por idade, por tempo de contribuição, especial). Deseja-se encapsular cada regra em uma classe intercambiável em tempo de execução, sem condicionais extensas. O padrão de projeto mais adequado é","o":["Singleton","Strategy","Observer","Decorator","Builder"],"a":1,"e":"Strategy define uma família de algoritmos intercambiáveis por meio de uma interface comum, respeitando o princípio aberto/fechado."},{"s":"ce","tag":"Ponto de Função","q":"Na Análise de Pontos de Função (IFPUG), as funções do tipo dado e do tipo transação são, respectivamente:","o":["ALI e AIE; EE, SE e CE.","EE e SE; ALI e AIE.","ALI e EE; AIE, SE e CE.","CE e SE; ALI e EE.","AIE e CE; ALI, EE e SE."],"a":0,"e":"Funções de dados: ALI (Arquivo Lógico Interno) e AIE (Arquivo de Interface Externa). Funções de transação: EE (Entrada Externa), SE (Saída Externa) e CE (Consulta Externa)."},{"s":"ce","tag":"Story Points","q":"Sobre a estimativa com Story Points, é correto afirmar que","o":["representam horas exatas de trabalho de um desenvolvedor.","substituem obrigatoriamente a Análise de Pontos de Função em contratos públicos.","devem ser usadas para comparar a produtividade entre equipes diferentes.","são definidos exclusivamente pelo Product Owner.","são medidas relativas de esforço, complexidade e incerteza, frequentemente estimadas com Planning Poker usando sequência semelhante à de Fibonacci."],"a":4,"e":"Story Points são relativos e próprios de cada time (não comparáveis entre times). Planning Poker promove consenso; a velocidade do time é usada para planejamento."},{"s":"ce","tag":"Requisitos","q":"Considere os requisitos: I. O sistema deve permitir a emissão de extrato de pagamentos. II. O sistema deve responder às consultas em até 2 segundos para 95% das requisições. III. O sistema deve estar disponível 99,9% do tempo. Classificam-se como não funcionais apenas","o":["I","II","I e II","II e III","I, II e III"],"a":3,"e":"I descreve uma funcionalidade (requisito funcional). II (desempenho) e III (disponibilidade) são atributos de qualidade, ou seja, requisitos não funcionais."},{"s":"ce","tag":"OWASP","q":"Na edição 2025 do OWASP Top 10, a categoria que ocupa a primeira posição (A01) e as duas categorias novas na lista são, respectivamente:","o":["Injection; Insecure Design e SSRF.","Security Misconfiguration; Authentication Failures e SSRF.","Cryptographic Failures; Security Misconfiguration e Logging Failures.","Broken Access Control; Injection e Insecure Design.","Broken Access Control; Software Supply Chain Failures e Mishandling of Exceptional Conditions."],"a":4,"e":"No OWASP Top 10:2025, Broken Access Control segue em A01 (agora incorporando SSRF). As novidades são A03 Software Supply Chain Failures (ampliação de “Vulnerable and Outdated Components”) e A10 Mishandling of Exceptional Conditions."},{"s":"ce","tag":"Segurança","q":"A forma mais eficaz de prevenir SQL Injection em uma aplicação Java que monta consultas com dados do usuário é","o":["remover espaços em branco da entrada.","usar consultas parametrizadas (PreparedStatement) ou parâmetros nomeados da JPA.","ocultar as mensagens de erro do banco, apenas.","criptografar o banco de dados.","usar HTTPS."],"a":1,"e":"Consultas parametrizadas separam código SQL de dados, impedindo que a entrada seja interpretada como comando. Ocultar erros e usar HTTPS não resolvem a injeção."},{"s":"ce","tag":"SAST/DAST","q":"Sobre SAST e DAST, assinale a correta.","o":["SAST analisa o código-fonte/binário sem executá-lo (caixa-branca); DAST testa a aplicação em execução, de fora, como caixa-preta.","SAST analisa a aplicação em execução, simulando ataques externos; DAST analisa o código-fonte.","Ambos exigem a aplicação em produção.","DAST é feito exclusivamente pelo compilador.","SAST só identifica erros de formatação."],"a":0,"e":"SAST: análise estática, cedo no ciclo (shift-left), aponta a linha do problema. DAST: análise dinâmica, encontra falhas de configuração e de execução, sem acesso ao código."},{"s":"ce","tag":"SDL","q":"No Ciclo de Vida de Desenvolvimento Seguro (SDL), a atividade de modelagem de ameaças (por exemplo, usando STRIDE) deve ocorrer preferencialmente na fase de","o":["design/projeto, antes da implementação.","manutenção, após incidentes.","implantação em produção.","descarte do sistema.","testes de aceitação do usuário."],"a":0,"e":"A modelagem de ameaças é feita no design, quando corrigir falhas é mais barato. STRIDE: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege."},{"s":"ce","tag":"OAuth2/SSO","q":"Sobre OAuth 2.0 e SSO, assinale a correta.","o":["OAuth 2.0 é um framework de autorização delegada, que emite access tokens; a autenticação (identidade) é tratada por uma camada como o OpenID Connect, base comum de soluções de SSO.","OAuth 2.0 é um protocolo de autenticação que transmite a senha do usuário ao aplicativo cliente.","SSO exige que o usuário se autentique separadamente em cada sistema.","No OAuth 2.0, o Resource Server emite os tokens de acesso.","O fluxo Authorization Code não deve ser usado em aplicações web."],"a":0,"e":"OAuth 2.0 define papéis (Resource Owner, Client, Authorization Server, Resource Server); quem emite tokens é o Authorization Server. OIDC acrescenta o ID Token. O Authorization Code (com PKCE) é o fluxo recomendado."},{"s":"ce","tag":"ISO 27001/27002","q":"Sobre as normas ABNT NBR ISO/IEC 27001:2022 e 27002:2022, assinale a correta.","o":["A ISO 27002 é a norma certificável que define requisitos do SGSI.","A ISO 27001 proíbe a análise de riscos.","A ISO 27002:2022 possui 114 controles em 14 seções.","As normas tratam exclusivamente de segurança física.","A ISO 27001 especifica requisitos para estabelecer, implementar, manter e melhorar um SGSI e é certificável; a ISO 27002:2022 é um guia com 93 controles organizados em 4 temas."],"a":4,"e":"Na versão 2022, a 27002 reúne 93 controles em 4 temas: organizacionais, pessoas, físicos e tecnológicos (a versão 2013 tinha 114 controles em 14 seções). A 27001 é a norma de requisitos, certificável."},{"s":"ce","tag":"Gestão de riscos","q":"Na gestão de riscos de segurança da informação, uma biblioteca desatualizada com falha conhecida, um grupo criminoso interessado nos dados e o vazamento de dados de milhões de cidadãos são, respectivamente, exemplos de","o":["ameaça, vulnerabilidade e impacto.","vulnerabilidade, ameaça e impacto.","impacto, ameaça e vulnerabilidade.","risco, controle e ameaça.","vulnerabilidade, impacto e ameaça."],"a":1,"e":"Vulnerabilidade é a fraqueza; ameaça é o agente ou evento que pode explorá-la; impacto é a consequência. Risco combina probabilidade e impacto."},{"s":"ce","tag":"Banco de dados","q":"A tabela MATRICULA(matricula_aluno, cod_curso, nome_aluno, nota), com chave primária composta (matricula_aluno, cod_curso), na qual nome_aluno depende apenas de matricula_aluno, viola a","o":["1FN, por possuir atributos multivalorados.","3FN, por possuir dependência transitiva.","2FN, por possuir dependência funcional parcial da chave.","FNBC, apenas.","integridade referencial."],"a":2,"e":"A 2FN exige que todo atributo não-chave dependa da chave inteira. nome_aluno depende só de parte dela (dependência parcial). A 3FN trata de dependências transitivas entre atributos não-chave."},{"s":"ce","tag":"SQL","q":"Considere SETOR(id, nome) e SERVIDOR(id, nome, setor_id). A consulta abaixo retorna","c":"SELECT s.nome\nFROM setor s\nLEFT JOIN servidor v ON v.setor_id = s.id\nGROUP BY s.nome\nHAVING COUNT(v.id) = 0;","o":["todos os servidores sem setor.","um erro, pois HAVING não pode usar COUNT.","os setores com pelo menos um servidor.","os setores que não possuem nenhum servidor.","todos os setores, com a contagem de servidores."],"a":3,"e":"O LEFT JOIN mantém todos os setores; setores sem servidores têm v.id NULL e COUNT(v.id) = 0. HAVING filtra grupos após a agregação."},{"s":"ce","tag":"SQL","q":"Assinale a opção que contém apenas comandos da DDL (Data Definition Language).","o":["SELECT, INSERT, UPDATE","CREATE, ALTER, DROP","GRANT, REVOKE, COMMIT","INSERT, DELETE, MERGE","CREATE, INSERT, SELECT"],"a":1,"e":"DDL define estruturas: CREATE, ALTER, DROP (e TRUNCATE, em muitas classificações). DML manipula dados: INSERT, UPDATE, DELETE, MERGE (e SELECT, para muitos autores). GRANT/REVOKE são DCL."},{"s":"ce","tag":"Banco de dados","q":"A propriedade ACID que garante que uma transação seja executada por completo ou não tenha nenhum efeito é a","o":["consistência.","atomicidade.","isolamento.","durabilidade.","disponibilidade."],"a":1,"e":"Atomicidade: “tudo ou nada”. Consistência: passa de um estado válido a outro. Isolamento: transações concorrentes não interferem. Durabilidade: após o commit, os dados persistem."},{"s":"ce","tag":"NoSQL","q":"Sobre bancos de dados NoSQL, a associação correta entre o modelo e um exemplo de SGBD é:","o":["chave-valor — Neo4j","colunar (família de colunas) — MySQL","grafos — Redis","documentos — MongoDB","documentos — Cassandra"],"a":3,"e":"Chave-valor: Redis; documentos: MongoDB; família de colunas: Cassandra/HBase; grafos: Neo4j. Redis também é exemplo clássico de banco em memória."},{"s":"ce","tag":"Big Data","q":"Sobre data lake e data warehouse, assinale a correta.","o":["O data lake armazena apenas dados estruturados e já tratados.","Data lake e data warehouse são sinônimos.","O data warehouse aceita apenas dados não estruturados.","O data lake armazena grandes volumes de dados brutos (estruturados, semiestruturados e não estruturados), com esquema aplicado na leitura (schema-on-read); o data warehouse armazena dados tratados e modelados (schema-on-write).","Data lakes não podem ser usados para ciência de dados."],"a":3,"e":"Data lakes guardam dados brutos para usos diversos (ciência de dados, ML). Data warehouses guardam dados integrados, limpos e modelados para análise e BI."},{"s":"ce","tag":"BI/OLAP","q":"Ao analisar um cubo OLAP de concessões de benefícios, o analista passa da visão por ano para a visão por mês. Essa operação é chamada de","o":["roll-up","pivot","slice","drill-down","dice"],"a":3,"e":"Drill-down aumenta o detalhe (ano → mês). Roll-up agrega (mês → ano). Slice fixa um valor de uma dimensão; dice seleciona um subcubo; pivot rotaciona os eixos."},{"s":"ce","tag":"COBIT 2019","q":"No COBIT 2019, o domínio de governança, que trata de avaliar, direcionar e monitorar, é o","o":["EDM — Avaliar, Direcionar e Monitorar","BAI — Construir, Adquirir e Implementar","DSS — Entregar, Servir e Suportar","APO — Alinhar, Planejar e Organizar","MEA — Monitorar, Avaliar e Analisar"],"a":0,"e":"O COBIT 2019 tem 40 objetivos em 5 domínios. EDM é o único de governança; APO, BAI, DSS e MEA são de gestão (management)."}];

</script>
<script>
(function(){
const SECTIONS=[
  {id:"lp",name:"Língua Portuguesa",mod:1,n:12,w:1},
  {id:"en",name:"Língua Inglesa",mod:1,n:12,w:1},
  {id:"rl",name:"Raciocínio Lógico Matemático",mod:1,n:5,w:1},
  {id:"at",name:"Atualidades e Inteligência Artificial",mod:1,n:6,w:1},
  {id:"lg",name:"Legislação de Segurança da Informação e Proteção de Dados",mod:1,n:5,w:1},
  {id:"ce",name:"Conhecimentos Específicos",mod:2,n:30,w:2.5}
];
const SEC=Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const L="ABCDE";
QUESTIONS.forEach((q,i)=>{q.id=i;q.num=i+1});
const range=id=>{const qs=QUESTIONS.filter(q=>q.s===id);return [qs[0].num,qs[qs.length-1].num]};

const KEY="caderno-azul-dataprev-v1";
let store={ans:{},streak:0,best:0,sim:null};
try{const raw=localStorage.getItem(KEY);if(raw)store=Object.assign(store,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};

let view={name:"home"};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}

function stats(){
  const done=Object.keys(store.ans).length;
  const ok=Object.entries(store.ans).filter(([id,a])=>QUESTIONS[id].a===a).length;
  document.getElementById("st-done").textContent=done+"/"+QUESTIONS.length;
  document.getElementById("st-acc").textContent=done?Math.round(ok/done*100)+"%":"—";
  document.getElementById("st-streak").textContent=store.streak;
  document.getElementById("st-best").textContent=store.best;
}
function secProgress(id){
  const qs=QUESTIONS.filter(q=>q.s===id);let ok=0,bad=0;
  qs.forEach(q=>{if(q.id in store.ans){store.ans[q.id]===q.a?ok++:bad++}});
  return {total:qs.length,ok,bad};
}
const wrongIds=()=>Object.entries(store.ans).filter(([id,a])=>QUESTIONS[id].a!==a).map(([id])=>+id);

/* ---------- HOME ---------- */
function renderHome(){
  const wr=wrongIds().length;
  const simOpen=store.sim&&!store.sim.done;
  let h=`<section class="modes">
    <button class="mode primary" data-act="sim">${simOpen?"<strong>Continuar simulado</strong><small>Sua prova está em andamento. O tempo continua contando.</small>":"<strong>Simulado de prova</strong><small>70 questões sorteadas na distribuição do edital, 4 horas, nota de 0 a 115.</small>"}</button>
    <button class="mode" data-act="all"><strong>Caderno completo</strong><small>As 140 questões em ordem, com gabarito e explicação a cada resposta.</small></button>
    <button class="mode" data-act="wrong" ${wr?"":"disabled"}><strong>Revisar erros</strong><small>${wr?wr+" questão"+(wr>1?"ões":"")+" para refazer.":"Nenhum erro registrado ainda."}</small></button>
  </section>`;
  [1,2].forEach(m=>{
    const secs=SECTIONS.filter(s=>s.mod===m);
    const tot=secs.reduce((a,s)=>a+s.n,0), pts=secs.reduce((a,s)=>a+s.n*s.w,0);
    h+=`<section class="module"><div class="module-head"><h2>Módulo ${m===1?"I · Conhecimentos Gerais":"II · Conhecimentos Específicos"}</h2><span>na prova: ${tot} questões · ${pts} pontos</span></div><div class="disc-list">`;
    secs.forEach(s=>{
      const p=secProgress(s.id),[a,b]=range(s.id);
      h+=`<button class="disc" data-sec="${s.id}">
        <span class="name">${s.name}</span>
        <span class="go">Treinar →</span>
        <span class="meta">Q${a}–Q${b} · ${p.total} questões (prova: ${s.n}, peso ${String(s.w).replace(".",",")}) · ${p.ok} certas, ${p.bad} erradas</span>
        <span class="bar" aria-hidden="true"><i class="b-ok" style="width:${p.ok/p.total*100}%"></i><i class="b-bad" style="width:${p.bad/p.total*100}%"></i></span>
      </button>`;
    });
    h+=`</div></section>`;
  });
  h+=`<div class="foot"><span>Aprovação na objetiva (item 9.17 do edital): no mínimo 57,5 pontos e nenhuma disciplina zerada.</span>
    <span id="reset-area"><button class="link" id="reset">Apagar meu progresso</button></span></div>`;
  app.innerHTML=h;
  app.querySelectorAll(".disc").forEach(b=>b.onclick=()=>startTrain(QUESTIONS.filter(q=>q.s===b.dataset.sec).map(q=>q.id),SEC[b.dataset.sec].name));
  app.querySelector('[data-act="all"]').onclick=()=>startTrain(QUESTIONS.map(q=>q.id),"Caderno completo");
  app.querySelector('[data-act="wrong"]').onclick=()=>{const w=wrongIds();if(w.length){w.forEach(id=>delete store.ans[id]);save();startTrain(w,"Revisão de erros")}};
  app.querySelector('[data-act="sim"]').onclick=()=>{if(!(store.sim&&!store.sim.done))newSim();view={name:"sim",i:0};render()};
  document.getElementById("reset").onclick=()=>{
    document.getElementById("reset-area").innerHTML=`<span class="confirm">Apagar todas as respostas e o simulado? <button class="btn" id="r-yes">Apagar</button><button class="btn" id="r-no">Cancelar</button></span>`;
    document.getElementById("r-no").onclick=renderHome;
    document.getElementById("r-yes").onclick=()=>{store={ans:{},streak:0,best:store.best,sim:null};save();render();toast("Progresso apagado")};
  };
}

/* ---------- TREINO ---------- */
function startTrain(ids,label){
  const first=ids.findIndex(id=>!(id in store.ans));
  view={name:"train",ids,label,i:first<0?0:first};render();
}
function optList(q,chosen,reveal){
  return `<ol class="opts">${q.o.map((o,k)=>{
    let c="";
    if(reveal){if(k===q.a)c="right";else if(k===chosen)c="wrong"}
    else if(k===chosen)c="sel";
    return `<li><button class="opt ${c}" data-k="${k}" ${reveal?"disabled":""} aria-label="Alternativa ${L[k]}"><span class="bub">${L[k]}</span><span>${esc(o)}</span></button></li>`;
  }).join("")}</ol>`;
}
function qBody(q,num){
  let h=`<div class="qhead"><span class="qnum">${String(num).padStart(2,"0")}</span><span class="qtag">${SEC[q.s].name}${q.tag?" · "+esc(q.tag):""}</span></div>`;
  if(q.t){const t=TEXTS[q.t];h+=`<details class="passage" ${view.openText!==false?"open":""}><summary>${esc(t.title)}</summary><div class="ptext">${esc(t.body)}<span class="src">${esc(t.src)}</span></div></details>`}
  h+=`<p class="stem">${esc(q.q)}</p>`;
  if(q.c)h+=`<pre class="code">${esc(q.c)}</pre>`;
  return h;
}
function renderTrain(){
  const {ids,i,label}=view, q=QUESTIONS[ids[i]], chosen=store.ans[q.id], done=chosen!==undefined;
  let h=`<div class="qbar"><button class="back" id="back">← Início</button><span class="chip">${esc(label)}</span><span class="spacer"></span><span class="mono" style="font-size:13px;color:var(--muted)">${i+1} de ${ids.length}</span></div>
  <div class="layout"><article class="sheet">${qBody(q,q.num)}${optList(q,chosen,done)}`;
  if(done){const ok=chosen===q.a;
    h+=`<div class="feedback ${ok?"":"no"}" role="status"><h3>${ok?"Acertou!":"Errou."} Gabarito: ${L[q.a]}</h3><p>${esc(q.e)}</p></div>`}
  h+=`<div class="nav"><button class="btn" id="prev" ${i===0?"disabled":""}>← Anterior</button><button class="btn solid" id="next" ${i===ids.length-1?"disabled":""}>Próxima →</button></div></article>
  <aside class="card"><h4>Cartão-resposta</h4><p class="hint">Toque num número para ir à questão.</p><div class="grid">${ids.map((id,k)=>{
    const a=store.ans[id];const c=a===undefined?"":(a===QUESTIONS[id].a?"ok":"no");
    return `<button class="cell ${c} ${k===i?"cur":""}" data-k="${k}" aria-label="Questão ${QUESTIONS[id].num}">${QUESTIONS[id].num}</button>`}).join("")}</div>
    <div class="legend"><span><i style="border-color:var(--ok);background:var(--ok-soft)"></i>certa</span><span><i style="border-color:var(--bad);background:var(--bad-soft)"></i>errada</span><span><i style="border-color:var(--line)"></i>em branco</span></div></aside></div>`;
  app.innerHTML=h;
  bindCommon();
  app.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;store.ans[q.id]=k;
    if(k===q.a){store.streak++;store.best=Math.max(store.best,store.streak)}else store.streak=0;
    save();renderTrain();stats();
    if(k===q.a&&store.streak>0&&store.streak%5===0)toast(store.streak+" acertos seguidos!");
  });
}
function bindCommon(){
  document.getElementById("back").onclick=()=>{view={name:"home"};render()};
  const go=k=>{view.i=k;render();window.scrollTo({top:0})};
  const p=document.getElementById("prev"),n=document.getElementById("next");
  if(p)p.onclick=()=>go(view.i-1);
  if(n)n.onclick=()=>go(view.i+1);
  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>go(+c.dataset.k));
  app.querySelectorAll("details.passage").forEach(d=>d.ontoggle=()=>{view.openText=d.open});
}

/* ---------- SIMULADO ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newSim(){
  let ids=[];
  SECTIONS.forEach(s=>{
    let pick=shuffle(QUESTIONS.filter(q=>q.s===s.id)).slice(0,s.n);
    pick.sort((x,y)=>x.id-y.id);
    ids=ids.concat(pick.map(q=>q.id));
  });
  store.sim={ids,ans:{},start:Date.now(),done:false};save();
}
const LIMIT=4*3600*1000;
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,"0")).join(":")}
let tick=null;
function renderSim(){
  const sim=store.sim,{i}=view,q=QUESTIONS[sim.ids[i]],chosen=sim.ans[q.id];
  const answered=Object.keys(sim.ans).length;
  let h=`<div class="qbar"><button class="back" id="back">← Início</button><span class="chip">Simulado · ${SEC[q.s].name}</span><span class="spacer"></span><span class="timer" id="timer"></span></div>
  <div class="layout"><article class="sheet">${qBody(q,i+1)}${optList(q,chosen,false)}
  <div class="nav"><button class="btn" id="prev" ${i===0?"disabled":""}>← Anterior</button><button class="btn solid" id="next" ${i===sim.ids.length-1?"disabled":""}>Próxima →</button></div></article>
  <aside class="card"><h4>Cartão-resposta</h4><p class="hint">${answered} de ${sim.ids.length} marcadas. O gabarito aparece ao entregar.</p><div class="grid">${sim.ids.map((id,k)=>
    `<button class="cell ${sim.ans[id]!==undefined?"ans":""} ${k===i?"cur":""}" data-k="${k}" aria-label="Questão ${k+1}">${k+1}</button>`).join("")}</div>
    <div id="sub-area"><button class="btn solid submit" id="submit">Entregar prova</button></div></aside></div>`;
  app.innerHTML=h;
  bindCommon();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sim.ans[q.id]=+b.dataset.k;save();renderSim()});
  document.getElementById("submit").onclick=()=>{
    const blank=sim.ids.length-Object.keys(sim.ans).length;
    document.getElementById("sub-area").innerHTML=`<div class="confirm" style="margin-top:14px">${blank?blank+" questões em branco. ":""}Entregar agora?<button class="btn" id="s-yes">Entregar</button><button class="btn" id="s-no">Voltar</button></div>`;
    document.getElementById("s-no").onclick=renderSim;
    document.getElementById("s-yes").onclick=finishSim;
  };
  const upd=()=>{const left=LIMIT-(Date.now()-sim.start);const t=document.getElementById("timer");if(!t)return;
    t.textContent=fmt(left);t.classList.toggle("low",left<15*60000);if(left<=0)finishSim()};
  clearInterval(tick);upd();tick=setInterval(upd,1000);
}
function finishSim(){
  clearInterval(tick);const sim=store.sim;sim.done=true;sim.end=Date.now();
  Object.entries(sim.ans).forEach(([id,a])=>{store.ans[id]=a});
  save();view={name:"result"};render();window.scrollTo({top:0});
}
function renderResult(){
  const sim=store.sim;
  if(!sim||!sim.done){view={name:"home"};return render()}
  let total=0,zero=false,rows="";
  SECTIONS.forEach(s=>{
    const ids=sim.ids.filter(id=>QUESTIONS[id].s===s.id);
    const ok=ids.filter(id=>sim.ans[id]===QUESTIONS[id].a).length;
    const pts=ok*s.w;total+=pts;if(ok===0)zero=true;
    rows+=`<tr><td>${s.name}</td><td class="n">${ids.length}</td><td class="n">${ok===0?'<span class="zero">0</span>':ok}</td><td class="n">${String(s.w).replace(".",",")}</td><td class="n">${pts.toFixed(1).replace(".",",")}</td></tr>`;
  });
  const pass=total>=57.5&&!zero;
  const dur=fmt((sim.end||Date.now())-sim.start);
  let h=`<div class="qbar"><button class="back" id="back">← Início</button><span class="chip">Resultado do simulado</span></div>
  <section class="result"><div class="score"><div class="big">${total.toFixed(1).replace(".",",")}<small> / 115</small></div>
    <span class="verdict ${pass?"pass":"fail"}">${pass?"Aprovado na objetiva":"Abaixo do critério"}</span>
    <p>Tempo de prova: ${dur}. Critério do edital: mínimo de 57,5 pontos e nenhuma disciplina zerada.${zero?" Atenção: houve disciplina zerada.":""}</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>Disciplina</th><th class="n">Questões</th><th class="n">Acertos</th><th class="n">Peso</th><th class="n">Pontos</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="nav" style="justify-content:flex-start"><button class="btn solid" id="review">Ver gabarito comentado</button><button class="btn" id="again">Novo simulado</button></div></section>`;
  app.innerHTML=h;
  document.getElementById("back").onclick=()=>{view={name:"home"};render()};
  document.getElementById("review").onclick=()=>{view={name:"review",i:0};render()};
  document.getElementById("again").onclick=()=>{newSim();view={name:"sim",i:0};render()};
}
function renderReview(){
  const sim=store.sim,{i}=view,q=QUESTIONS[sim.ids[i]],chosen=sim.ans[q.id];
  let h=`<div class="qbar"><button class="back" id="back">← Início</button><span class="chip">Gabarito do simulado</span><span class="spacer"></span><button class="back" id="toRes">Ver nota</button></div>
  <div class="layout"><article class="sheet">${qBody(q,i+1)}${optList(q,chosen,true)}
  <div class="feedback ${chosen===q.a?"":"no"}"><h3>${chosen===undefined?"Em branco.":chosen===q.a?"Acertou!":"Errou."} Gabarito: ${L[q.a]}</h3><p>${esc(q.e)}</p></div>
  <div class="nav"><button class="btn" id="prev" ${i===0?"disabled":""}>← Anterior</button><button class="btn solid" id="next" ${i===sim.ids.length-1?"disabled":""}>Próxima →</button></div></article>
  <aside class="card"><h4>Cartão-resposta</h4><p class="hint">Sua marcação comparada ao gabarito.</p><div class="grid">${sim.ids.map((id,k)=>{
    const a=sim.ans[id];const c=a===undefined?"":(a===QUESTIONS[id].a?"ok":"no");
    return `<button class="cell ${c} ${k===i?"cur":""}" data-k="${k}">${k+1}</button>`}).join("")}</div></aside></div>`;
  app.innerHTML=h;bindCommon();
  document.getElementById("toRes").onclick=()=>{view={name:"result"};render()};
}

function render(){
  if(view.name!=="sim")clearInterval(tick);
  ({home:renderHome,train:renderTrain,sim:renderSim,result:renderResult,review:renderReview})[view.name]();
  stats();
}
document.addEventListener("keydown",e=>{
  if(!["train","sim","review"].includes(view.name)||e.target.closest&&e.target.closest("input,textarea"))return;
  const k="abcde".indexOf(e.key.toLowerCase());
  if(k>=0){const b=app.querySelector(`.opt[data-k="${k}"]:not([disabled])`);if(b)b.click()}
  else if(e.key==="ArrowRight"){const n=document.getElementById("next");if(n&&!n.disabled)n.click()}
  else if(e.key==="ArrowLeft"){const p=document.getElementById("prev");if(p&&!p.disabled)p.click()}
});
render();
})();
</script>

</body>
</html>
